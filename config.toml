# 多MCP服务器配置
[[mcp_servers]]
name = "playwright"
server_command = "npx"
server_args = ["@playwright/mcp@latest"]
transport = "stdio"
timeout_secs = 30
max_retries = 3
is_default = true
categories = ["Browser"]

