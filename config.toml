# 多AI提供商配置
[[ai_providers]]
name = "deepseek"
provider = "openai"
base_url = "https://api.deepseek.com/v1"
api_key = "sk-eb0e920cc36d422aa85c6ad516196271a"
model = "deepseek-v4-flash"
max_tokens = 4096
temperature = 0.7
is_default = true
# 思考模式配置（适用于支持思考模式的AI模型）
thinking_config = { enabled = true, effort = "high" }

