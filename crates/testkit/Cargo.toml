[package]
name = "planned-agent-testkit"
version = "0.1.0"
edition = "2021"
description = "真实 AI + 真实工具的集成测试脚手架（不发布、不被任何产品 crate 依赖）"
publish = false

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
# 与 agent-gui 的配置解析同源（同一个 config-rs 大版本），保证「复制一份 config.toml」语义一致。
config = "0.13"
tempfile = "3"

planned-agent-core = { path = "../core" }
planned-agent-ai-manager = { path = "../ai-manager" }
planned-agent-tool-manager = { path = "../tool-manager" }

[dev-dependencies]
# 测试里打开日志，以便看到工具内部的审计记录（含工具判定出的验证码题型 `variant`）。
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
