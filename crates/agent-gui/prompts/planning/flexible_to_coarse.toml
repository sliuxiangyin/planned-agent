[name]
description = "灵活模式完整需求→粗粒度计划提炼"

[content]
text = """
你是一个任务提炼专家。从以下完整需求定义中，提取出结构化的粗粒度计划。

完整需求定义包含以下段落（按需出现）：
- **需求描述**：要完成什么任务
- **输入参数**：任务依赖的外部输入（参数名、描述、示例值）
- **执行步骤**：灵活执行时记录的关键操作步骤
- **工具路径**：实际调用的工具名、参数及结果摘要
- **输出格式**：最终交付物的格式与字段定义

完整需求定义：
{{ trace_summary }}

{% if output_schema_hint %}用户已确认的输出格式：
{{ output_schema_hint }}
（「输出格式」段落以用户确认的为准；仅当完整需求包含「输出格式」节时输出该段落）
{% endif %}

请先输出「输出格式」段落（仅当完整需求包含「输出格式」节时），再输出粗粒度计划 JSON。

## 输出格式
（用自然语言描述本次计划的最终输出格式。例如："JSON 对象数组，每项含 name(string)、url(string)、summary(string)"，或 "Markdown 格式的综合分析报告"。**仅当完整需求包含「输出格式」节时输出本段落**，优先从该节提取；若无「输出格式」节，表示输出由执行时实时决定、不固化——省略本段落，不要凭任务意图推断。）

---

请严格按照以下 JSON 结构返回粗粒度计划（顶层只有 steps，每步只有四个字段）：
{{ example }}

字段说明：
- steps[]：粗粒度步骤列表，按执行顺序排列，至少 1 步。
  - result_reference：结果引用标识，严格使用 #E + 数字（#E1、#E2…），计划内唯一。
  - intent：从需求描述与执行步骤归纳出的子目标，原样保留实体（URL、关键词、文件名、人名、地名、参数值等），暂不泛化；该步骤需要的前置条件、数据来源也写在 intent 里。若需求定义中出现参数占位符，在 intent 中原样保留，不要替换为具体值。
  - expected_output：可验证产出，写清“满足什么条件算完成”。
  - dependencies：依赖的前序 result_reference，只能引用本计划中已出现的 #E 编号；无依赖写 []。
- 不要输出 id、order、title、description、复杂度、风险等级、数据需求、工具分类、input_schema、execution_guide 等字段，这些由系统补全，或在需求定义中保留。

要求：
1. 从「需求描述」和「执行步骤」中识别关键步骤，总结其 intent 与 expected_output。
2. 机械操作合并：取前 N 条、排序、字段重命名、简单格式整理，合并到上游步骤的 expected_output。
3. 语义处理可独立成步：总结、翻译、分类、重写、抽取非结构化内容、语义分析。
4. 每个步骤只表达一个可验收子目标，禁止用“并”“和”“然后”把多个独立目标塞进同一步。
5. 不要拆成工具级微步骤：不要写“调用某工具”“执行某 SQL”“发送某请求”，除非需求中原样给出。
6. 推断步骤间依赖，填充 dependencies（用 #E1、#E2 等格式引用）。
7. 信息不足时不要编造：写进 intent，或增加一个“确认/澄清”步骤。
"""

[variables]
trace_summary = { description = "完整需求定义文本（含需求描述、输入参数、执行步骤、工具路径、输出格式）", required = true }
output_schema_hint = { description = "用户确认的输出格式（可选，空字符串表示未设置）", required = false }

[output_schema]
format = "json"
constraints = "「输出格式」段落之后的其余内容必须为有效JSON，不要包含其他说明文本"

[output_schema.json_schema]
type = "object"
required = ["steps"]

[output_schema.json_schema.properties.steps]
type = "array"
description = "粗粒度步骤列表（至少 1 步，按执行顺序）"

[output_schema.json_schema.properties.steps.items]
type = "object"
required = ["result_reference", "intent", "expected_output", "dependencies"]

[output_schema.json_schema.properties.steps.items.properties.result_reference]
type = "string"
description = "结果引用标识，格式：#E1"
pattern = "^#E\\d+$"

[output_schema.json_schema.properties.steps.items.properties.intent]
type = "string"
description = "子目标描述（含该步骤需要的前置条件），原样保留实体"

[output_schema.json_schema.properties.steps.items.properties.expected_output]
type = "string"
description = "可验证产出（含验收条件）"

[output_schema.json_schema.properties.steps.items.properties.dependencies]
type = "array"
items = { type = "string", pattern = "^#E\\d+$" }
description = "依赖的前序步骤结果引用列表（#E1 格式），无依赖为 []"

[output_schema.example]
text = """
{
  "steps": [
    {
      "result_reference": "#E1",
      "intent": "从需求定义的实参中读取待处理数据源",
      "expected_output": "得到待处理数据源的完整内容",
      "dependencies": []
    },
    {
      "result_reference": "#E2",
      "intent": "对 #E1 的内容做需求中描述的语义处理",
      "expected_output": "处理后的结构化结果",
      "dependencies": ["#E1"]
    },
    {
      "result_reference": "#E3",
      "intent": "按需求定义的输出格式组织 #E2 的结果",
      "expected_output": "符合需求「输出格式」节定义的交付物",
      "dependencies": ["#E2"]
    }
  ]
}"""
