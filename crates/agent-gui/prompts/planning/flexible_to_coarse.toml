[name]
description = "灵活模式完整需求→粗粒度计划提炼"

[content]
text = """
你是一个任务提炼专家。从以下完整需求定义中，提取出结构化的粗粒度计划。

完整需求定义包含以下段落（按需出现）：
- **需求描述**：要完成什么任务
- **输入参数**：任务依赖的外部输入（参数名、描述、示例值）
- **执行步骤**：灵活执行时记录的关键操作步骤
- **工具路径**：实际调用的工具名、参数及结果摘要
- **输出格式**：最终交付物的格式与字段定义

完整需求定义：
{{ trace_summary }}

{% if output_schema_hint %}用户已确认的输出格式：
{{ output_schema_hint }}
（「输出格式」段落以用户确认的为准；仅当完整需求包含「输出格式」节时输出该段落）
{% endif %}

请先输出「输出格式」段落（仅当完整需求包含「输出格式」节时），再输出粗粒度计划 JSON。

## 输出格式
（用自然语言描述本次计划的最终输出格式。例如："JSON 对象数组，每项含 name(string)、url(string)、summary(string)"，或 "Markdown 格式的综合分析报告"。**仅当完整需求包含「输出格式」节时输出本段落**，优先从该节提取；若无「输出格式」节，表示输出由执行时实时决定、不固化——省略本段落，不要凭任务意图推断。）

---

请严格按照以下JSON格式返回粗粒度计划：
{{ example }}

要求：
1. 从需求描述和执行步骤中识别关键步骤，总结其意图（intent）和预期输出（expected_output）
2. 每个步骤必须为原子动作，只包含一个操作
3. 推断步骤间的依赖关系，填充 dependencies（用 #E1、#E2 等格式引用）
4. 为每个步骤分配唯一的 result_reference（#E1, #E2...）
5. 评估整体复杂度（simple / medium / complex）和风险等级（low / medium / high / critical）
6. 步骤中的实体值（URL、关键词、文件名、人名、地名等）原样保留，暂不泛化
7. data_requirements 可从执行步骤和工具路径的上下文推断，推荐工具分类可留空
8. **execution_guide**：从「执行步骤」「工具路径」浓缩提炼的操作指引（自然语言，3-8 句话），供后续计划执行时参考、防止跑偏；如无执行步骤/工具路径，填空字符串 ""

原子动作判断标准：
- 如果步骤描述中包含"提取...并排序"、"解析...并处理"等，说明包含多个操作，必须拆分
- 如果步骤可以用一个工具完成，就是原子动作
- 如果步骤需要先用一个工具获取数据，再用另一个工具处理，就不是原子动作

输入参数（input_schema）约束：
- **仅当完整需求包含「输入参数」节时输出 `input_schema`**，优先从该节提取参数名与示例值（已固化参数以 `{% raw %}{{param_name}}{% endraw %}` 占位符表示）。
- 无「输入参数」节表示输入固定、无需参数化：省略 input_schema 字段，不要凭任务意图推断。
- 无外部输入参数的计划可省略该字段；input_schema 描述"计划需要什么参数"，不是步骤结果。
"""

[variables]
trace_summary = { description = "完整需求定义文本（含需求描述、输入参数、执行步骤、工具路径、输出格式）", required = true }
output_schema_hint = { description = "用户确认的输出格式（可选，空字符串表示未设置）", required = false }

[output_schema]
format = "json"
constraints = "「输出格式」段落之后的其余内容必须为有效JSON，不要包含其他说明文本"

[output_schema.json_schema]
type = "object"
required = ["id", "title", "description", "steps", "complexity", "risk_level"]

[output_schema.json_schema.properties.id]
type = "string"
description = "计划唯一标识"

[output_schema.json_schema.properties.title]
type = "string"
description = "计划标题"

[output_schema.json_schema.properties.description]
type = "string"
description = "计划描述"

[output_schema.json_schema.properties.steps]
type = "array"
description = "粗粒度步骤列表"

[output_schema.json_schema.properties.steps.items]
type = "object"
required = ["id", "order", "intent", "expected_output", "result_reference", "dependencies", "data_requirements", "recommended_tool_categories"]

[output_schema.json_schema.properties.steps.items.properties.id]
type = "string"
description = "步骤ID"

[output_schema.json_schema.properties.steps.items.properties.order]
type = "integer"
description = "步骤顺序"

[output_schema.json_schema.properties.steps.items.properties.intent]
type = "string"
description = "意图描述，如：获取搜索结果"

[output_schema.json_schema.properties.steps.items.properties.expected_output]
type = "string"
description = "预期输出描述"

[output_schema.json_schema.properties.steps.items.properties.result_reference]
type = "string"
description = "结果引用标识，格式：#E1"
pattern = "^#E\\d+$"

[output_schema.json_schema.properties.steps.items.properties.dependencies]
type = "array"
items = { type = "string", pattern = "^#E\\d+$" }
description = "依赖的步骤结果引用列表（#E1 格式）"

[output_schema.json_schema.properties.steps.items.properties.data_requirements]
type = "array"
description = "数据需求列表"

[output_schema.json_schema.properties.steps.items.properties.data_requirements.items]
type = "object"
required = ["name", "description", "required", "source_hint"]

[output_schema.json_schema.properties.steps.items.properties.data_requirements.items.properties.name]
type = "string"
description = "需求名称"

[output_schema.json_schema.properties.steps.items.properties.data_requirements.items.properties.description]
type = "string"
description = "需求描述"

[output_schema.json_schema.properties.steps.items.properties.data_requirements.items.properties.required]
type = "boolean"
description = "是否必需"

[output_schema.json_schema.properties.steps.items.properties.data_requirements.items.properties.source_hint]
type = "string"
description = "来源提示"

[output_schema.json_schema.properties.steps.items.properties.recommended_tool_categories]
type = "array"
items = { type = "string", enum = ["Browser", "File", "Text", "Data", "System", "Device", "Dev", "Utility"] }
description = "推荐的工具分类（可选，可为空数组）"

[output_schema.json_schema.properties.complexity]
type = "string"
enum = ["simple", "medium", "complex"]
description = "计划复杂度"

[output_schema.json_schema.properties.risk_level]
type = "string"
enum = ["low", "medium", "high", "critical"]
description = "风险等级"

[output_schema.json_schema.properties.input_schema]
type = "object"
description = "输入参数定义（可选）：键为参数名（snake_case），值为 {type, description, example} 参数定义对象"

[output_schema.json_schema.properties.execution_guide]
type = "string"
description = "执行指导：从执行步骤和工具路径中浓缩的操作指引，供计划执行时参考"

[output_schema.example]
text = """
{
  "id": "plan-flex-001",
  "title": "执行任务",
  "description": "根据完整需求提炼的计划",
  "steps": [ 
    {
      "id": "step-1",
      "order": 1,
      "intent": "获取输入数据",
      "expected_output": "获取所需数据",
      "result_reference": "#E1",
      "dependencies": [],
      "data_requirements": [
        {
          "name": "input",
          "description": "输入数据",
          "required": true,
          "source_hint": "从用户输入中提取"
        }
      ],
      "recommended_tool_categories": ["File"]
    },
    {
      "id": "step-2",
      "order": 2,
      "intent": "处理数据",
      "expected_output": "处理后的数据",
      "result_reference": "#E2",
      "dependencies": ["#E1"],
      "data_requirements": [
        {
          "name": "data",
          "description": "待处理数据",
          "required": true,
          "source_hint": "从 #E1 中获取"
        }
      ],
      "recommended_tool_categories": ["Text"]
    }
  ],
  "complexity": "medium",
  "risk_level": "low",
  "execution_guide": "首先使用浏览器工具导航到目标页面并搜索关键词，提取前N条结果；然后用文件工具将结果写入本地文件。注意等待页面加载完成后再提取数据。",
  "input_schema": {
    "keyword": {
      "type": "string",
      "description": "搜索关键词",
      "example": "安仁乡"
    },
    "limit": {
      "type": "integer",
      "description": "返回结果条数",
      "example": 3
    }
  }
}"""
