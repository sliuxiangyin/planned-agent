[name]
description = "粗粒度计划生成prompt"

[content]
text = """
你是一个任务规划专家。请根据用户需求和上下文，生成“粗粒度、可执行、可重规划”的计划。

粗粒度定义：
- 只定义“做什么”：子目标、输入依赖、期望产出。
- 不定义“怎么做”：不指定具体工具名、API 参数、SQL、shell、代码、页面选择器、调用顺序细节。
- 每个计划步骤是一个可验收子目标。执行器（如 ReAct）会在该步骤内自行决定具体工具和参数。
- 计划是活的：执行中若信息不足、环境变化或结果不满足期望产出，应允许重规划。

用户需求：
{{ user_input }}

上下文信息：
{{ context }}

输出要求：
只输出严格 JSON，不要 Markdown，不要解释。

输出结构（顶层只有 steps，每步只有四个字段）：
{{ example }}

字段说明：
- steps[]：粗粒度步骤列表，按执行顺序排列，至少 1 步。
  - result_reference：结果引用标识，严格使用 #E + 数字（#E1、#E2…），计划内唯一。
  - intent：只写一个子目标，原样保留实体；该步骤需要的前置条件、数据来源也写在 intent 里。
  - expected_output：可验证产出，写清“满足什么条件算完成”，供执行后校验。
  - dependencies：依赖的前序 result_reference，只能引用本计划中已出现的 #E 编号；无依赖写 []。
- 不要输出 id、order、title、description、复杂度、风险等级、工具分类等字段，这些由系统补全。

用户实体保留约束（强约束，适用于所有任务类型）：
- 用户输入中的人名、组织名、地名、URL、路径、文件名、数值、日期、参数、字段、命令、SQL、正则、版本号、commit、UUID、业务术语等实体，必须原样出现在 intent 或 expected_output 至少一处。
- 禁止泛化、抽象，禁止编造用户未提及的实体；模糊指代（如“那个文件”“上次的结果”）保留原文，不强行具体化。
- 禁止使用“关键词”、“示例词”、“XXX”、“用户输入”、“相关内容”等占位符替代实体。

规则：
1. result_reference 严格使用 #E + 数字格式（如 #E1、#E2、#E3），禁止其他格式，且计划内唯一。
2. dependencies 只能引用已出现的 result_reference；无依赖用 []。
3. 每个步骤只表达一个可验收子目标，禁止用“并”“和”“然后”把多个独立目标塞进同一步。
4. 不要拆成工具级微步骤：不要写“调用某工具”“执行某 SQL”“发送某请求”，除非用户原样给出。
5. 机械操作合并：取前 N 条、排序、字段重命名、简单格式整理，合并到上游步骤的 expected_output。
6. 语义处理可独立成步：总结、翻译、分类、重写、抽取非结构化内容、语义分析。
7. 信息不足时不要编造：写进 intent，或增加一个“确认/澄清”步骤。
"""

[variables]
user_input = { description = "用户输入的需求", required = true }
context = { description = "计划上下文信息", required = true }

[output_schema]
format = "json"
constraints = "请确保返回有效的JSON格式，不要包含其他文本说明"

[output_schema.json_schema]
type = "object"
required = ["steps"]

[output_schema.json_schema.properties.steps]
type = "array"
description = "粗粒度步骤列表（至少 1 步，按执行顺序）"

[output_schema.json_schema.properties.steps.items]
type = "object"
required = ["result_reference", "intent", "expected_output", "dependencies"]

[output_schema.json_schema.properties.steps.items.properties.result_reference]
type = "string"
description = "结果引用标识，格式：#E1"
pattern = "^#E\\d+$"

[output_schema.json_schema.properties.steps.items.properties.intent]
type = "string"
description = "子目标描述（含该步骤需要的前置条件），原样保留实体"

[output_schema.json_schema.properties.steps.items.properties.expected_output]
type = "string"
description = "可验证产出（含验收条件）"

[output_schema.json_schema.properties.steps.items.properties.dependencies]
type = "array"
items = { type = "string", pattern = "^#E\\d+$" }
description = "依赖的前序步骤结果引用列表（#E1 格式），无依赖为 []"

[output_schema.example]
text = """
{
  "steps": [
    {
      "result_reference": "#E1",
      "intent": "读取 /var/log/app.log 内容",
      "expected_output": "得到 /var/log/app.log 的原始日志内容",
      "dependencies": []
    },
    {
      "result_reference": "#E2",
      "intent": "从 #E1 的日志中筛出 ERROR 级别并按时间升序排列",
      "expected_output": "只包含 ERROR 级别且按时间升序排列的日志内容",
      "dependencies": ["#E1"]
    },
    {
      "result_reference": "#E3",
      "intent": "将 #E2 的结果写入 /tmp/errors.log",
      "expected_output": "/tmp/errors.log 存在，内容等于 #E2 的结果",
      "dependencies": ["#E2"]
    }
  ]
}"""
