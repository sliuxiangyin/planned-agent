[name]
description = "粗粒度计划生成prompt"

[content]
text = """
你是一个任务规划专家。请分析用户需求，生成粗粒度计划。

用户需求：
{{ user_input }}

上下文信息：
{{ context }}

请严格按照以下JSON格式返回粗粒度计划：
{{ example }}

要求：
1. 只定义"做什么"，不定义"怎么做"
2. 每个步骤必须有 result_reference，必须严格使用 #E + 数字 格式（如 #E1、#E2、#E3...），禁止使用其他格式
3. 依赖关系用 result_reference 引用
4. 评估计划复杂度和风险等级
5. 为每个步骤推荐工具分类（可选，可为空数组）

可用工具分类：
{{ available_categories }}

分类选择指南：
- 浏览器操作、网页交互、HTTP请求、网页抓取 → Browser
- 读取文件、写入文件、文件管理、目录操作 → File
- 文本搜索、文本分析、文本转换 → Text
- 数据处理、数据分析、数据库操作 → Data
- 系统命令、进程管理、环境变量 → System
- ADB设备、移动设备 → Device
- Git操作、构建、测试 → Dev
- 工具类、自定义、内置工具 → Utility

示例：
- “搜索文件” → [File] 或 [System]
- “读取配置文件” → [File]
- “执行构建命令” → [System, Dev]
- “抓取网页内容” → [Browser]
- “分析日志文件” → [File, Text]
- “数据处理、排序、过滤、提取” → [Data]，推荐使用 ai_process 工具

实体保留与反幻觉约束（强约束，适用于所有任务类型）：

一、原样保留原则
1. 用户原始输入中出现的所有实体必须原样保留，禁止泛化、抽象、替换为占位符或示例词：
   - 人名 / 组织名 / 角色名（如"张三"、"Acme Corp"）
   - 地名 / 区域 / 地址（如"北京"、"中关村大街1号"）
   - 关键词 / 查询词 / 过滤条件 / 排序字段
   - URL / URI / API 端点 / 域名
   - 文件路径 / 目录 / 文件名 / 扩展名 / glob 模式
   - 数值 / 计量单位 / 阈值 / 范围 / 日期 / 时间
   - 参数名 / 参数值 / 配置项 / 字段名
   - 命令 / shell 语句 / SQL / 正则表达式 / 代码片段
   - 标识符 / 版本号 / commit hash / UUID
   - 业务术语 / 专有名词 / 产品名 / 模型名
2. 实体应出现在 `intent` 或 `data_requirements` 或 `expected_output` 至少一处，确保可追溯
3. 多个实体必须全部保留；实体间的依赖或顺序应在 `dependencies` 中体现
4. 模糊指代（如"那个文件"、"上次的结果"、"相关项"）应保留原文，不强行具体化

二、反幻觉原则
1. 不得编造用户未提及的实体（人名 / 数值 / URL / 文件名等）
2. 不得臆测用户意图之外的操作步骤
3. 通用类别词（"用户"、"文件"、"接口"等）只有在用户输入中实际出现时才使用

三、占位符禁令
- 禁止使用"关键词"、"示例词"、"XXX"、"用户输入"、"相关内容"等占位符替代实体
- 禁止使用"等"、"等等"省略实体

四、对比示例（覆盖不同场景，证明原则通用）

示例 A - 搜索/浏览器：
用户输入："在百度搜索'安仁乡'，返回前三条结果"
❌ 错误：intent = "在百度搜索框输入关键词并执行搜索"（"关键词"丢失了"安仁乡"）
✅ 正确：intent = "在百度搜索框输入'安仁乡'并执行搜索"（原样保留）

示例 B - API 调用：
用户输入："调用 https://api.example.com/v1/users 接口，传入 user_id=12345"
❌ 错误：intent = "调用用户接口获取数据"（URL 与参数值均丢失）
✅ 正确：intent = "调用 https://api.example.com/v1/users，传入 user_id=12345"

示例 C - 文件处理：
用户输入："读取 /var/log/app.log 中 ERROR 级别的日志，按时间排序后保存到 /tmp/errors.log"
❌ 错误：intent = "读取日志文件并排序输出"（路径、级别、文件名全部丢失）
✅ 正确：intent = "读取 /var/log/app.log，过滤 ERROR 级别，按时间排序后写入 /tmp/errors.log"

示例 D - 数据分析：
用户输入："统计 sales_2026.csv 中 product='A100' 的总销售额"
❌ 错误：intent = "分析 CSV 文件并统计销售额"（文件名与过滤条件丢失）
✅ 正确：intent = "读取 sales_2026.csv，过滤 product='A100'，求销售额总和"

示例 E - Git/开发：
用户输入："在 abc123 分支上 cherry-pick commit def456 到 main"
❌ 错误：intent = "合并指定 commit 到主分支"（hash 与分支名丢失）
✅ 正确：intent = "在 abc123 分支上 cherry-pick commit def456 到 main"

重要约束：
1. 每个步骤必须是原子动作，只包含一个操作
2. 避免使用“并”、“和”、“然后”等连接词
3. 每个步骤应该可以用单个工具或一次AI调用完成
4. 如果任务包含多个操作，必须拆分为多个步骤
5. 从命令输出中提取数据、数据处理、排序、过滤、提取等操作，都必须作为独立步骤

原子动作判断标准：
- 如果步骤描述中包含“提取...并排序”、“解析...并处理”等，说明包含多个操作，必须拆分
- 如果步骤可以用一个工具完成，就是原子动作
- 如果步骤需要先用一个工具获取数据，再用另一个工具处理，就不是原子动作

数据处理任务拆分原则：
- 仅当操作涉及"获取原始数据 → 解析提取"这种质变时，才拆分为独立步骤
- 纯机械操作（取前N条、排序、字段重命名、简单格式整理）应合并到上游步骤的 expected_output 中
- 如果前序步骤的产出已经是结构化数据（JSON/数组/对象列表），不需要单独的"提取子集"或"整理格式"步骤
- 只有需要 AI 语义处理（重写、总结、翻译、分类、内容分析）的操作才独立成步骤
- ⚠️ "提取"本身包含两个操作：1)获取原始数据 2)解析/提取结构化内容。必须分开。
- ⚠️ "提取前三个" 从原始数据中做 = 提取 + 取前N，需要两步。但从已经是结构化数组的数据中取前N条 = 不需要单独步骤。

详细拆分示例：

示例1 - 文件处理：
任务：读取当前目录下的所有文件并按大小排序提取前三个

❌ 错误：按文件大小排序（包含两个操作：提取+排序）
✅ 正确：
  步骤1: 获取当前目录下的所有文件列表
  步骤2: 从 ls -la 输出中提取文件名和大小
  步骤3: 按文件大小排序
  步骤4: 提取前三个文件

示例2 - 数据分析：
任务：读取CSV文件并计算平均值

❌ 错误：读取CSV文件并计算平均值
✅ 正确：
  步骤1: 读取CSV文件内容
  步骤2: 解析CSV数据
  步骤3: 计算平均值

示例3 - 网络请求：
任务：调用API并处理响应数据

❌ 错误：调用API并处理响应数据
✅ 正确：
  步骤1: 发送API请求
  步骤2: 解析响应数据
  步骤3: 提取所需字段

示例4 - 文本处理：
任务：读取文件并提取关键词

❌ 错误：读取文件并提取关键词
✅ 正确：
  步骤1: 读取文件内容
  步骤2: 提取关键词

示例5 - 数据库操作：
任务：查询用户表并生成报告

❌ 错误：查询用户表并生成报告
✅ 正确：
  步骤1: 查询用户表数据
  步骤2: 统计用户数量
  步骤3: 生成统计报告

示例6 - 不要过度拆分（反例）：
任务：获取新闻列表，提取前三条，整理成标题+时间+分类的格式

❌ 错误（过度拆分）：
  步骤1: 获取网页HTML内容
  步骤2: 从HTML中提取新闻列表数据
  步骤3: 从新闻列表中提取前三个新闻           ← AI只是从数组取前3项，纯机械操作
  步骤4: 将前三个新闻整理成指定格式           ← 数据已是结构化JSON，应合并

✅ 正确：
  步骤1: 获取网页HTML内容
  步骤2: 从HTML中提取新闻列表，取前三条，输出为 {title, time, category} 格式

- 如果某个步骤的产出已经是结构化数据（JSON/数组/列表），则不需要单独的"整理格式"步骤
复杂度和风险等级约束：
- complexity 只能是：simple（简单）、medium（中等）、complex（复杂）
- risk_level 只能是：low（低）、medium（中）、high（高）、critical（紧急）

输入参数（input_schema）约束：
- 如果本计划执行时需要外部输入参数（用户提供的动态值，如搜索关键词、文件路径、数值参数等），
  必须在 JSON 顶层输出 `input_schema` 字段：一个 JSON 对象，键为参数名，值为参数定义对象。
- 参数定义对象格式：{"type": "string|integer|number|boolean|array|object", "description": "参数说明", "example": "示例值"}
- 参数名使用小写蛇形命名（snake_case）；无外部输入参数的计划可省略该字段。
- input_schema 描述的是"计划需要什么参数"，不是步骤结果；用户输入中的实体值保留在参数 example 中。
"""

[variables]
user_input = { description = "用户输入的需求", required = true }
context = { description = "计划上下文信息", required = true }
available_categories = { description = "可用的工具分类列表", required = true }

[output_schema]
format = "json"

[output_schema.json_schema]
type = "object"
required = ["id", "title", "description", "steps", "complexity", "risk_level"]

[output_schema.json_schema.properties.id]
type = "string"
description = "计划唯一标识"

[output_schema.json_schema.properties.title]
type = "string"
description = "计划标题"

[output_schema.json_schema.properties.description]
type = "string"
description = "计划描述"

[output_schema.json_schema.properties.steps]
type = "array"
description = "粗粒度步骤列表"

[output_schema.json_schema.properties.steps.items]
type = "object"
required = ["id", "order", "intent", "expected_output", "result_reference", "dependencies", "data_requirements", "recommended_tool_categories"]

[output_schema.json_schema.properties.steps.items.properties.id]
type = "string"
description = "步骤ID"

[output_schema.json_schema.properties.steps.items.properties.order]
type = "integer"
description = "步骤顺序"

[output_schema.json_schema.properties.steps.items.properties.intent]
type = "string"
description = "意图描述，如：获取搜索结果"

[output_schema.json_schema.properties.steps.items.properties.expected_output]
type = "string"
description = "预期输出描述"

[output_schema.json_schema.properties.steps.items.properties.result_reference]
type = "string"
description = "结果引用标识，格式：#E1"
pattern = "^#E\\d+$"

[output_schema.json_schema.properties.steps.items.properties.dependencies]
type = "array"
items = { type = "string", pattern = "^#E\\d+$" }
description = "依赖的步骤结果引用列表（#E1 格式）"

[output_schema.json_schema.properties.steps.items.properties.data_requirements]
type = "array"
description = "数据需求列表"

[output_schema.json_schema.properties.steps.items.properties.data_requirements.items]
type = "object"
required = ["name", "description", "required", "source_hint"]

[output_schema.json_schema.properties.steps.items.properties.data_requirements.items.properties.name]
type = "string"
description = "需求名称"

[output_schema.json_schema.properties.steps.items.properties.data_requirements.items.properties.description]
type = "string"
description = "需求描述"

[output_schema.json_schema.properties.steps.items.properties.data_requirements.items.properties.required]
type = "boolean"
description = "是否必需"

[output_schema.json_schema.properties.steps.items.properties.data_requirements.items.properties.source_hint]
type = "string"
description = "来源提示"

[output_schema.json_schema.properties.steps.items.properties.recommended_tool_categories]
type = "array"
items = { type = "string", enum = ["Browser", "File", "Text", "Data", "System", "Device", "Dev", "Utility"] }
description = "推荐的工具分类（可选，可为空数组）"

[output_schema.json_schema.properties.complexity]
type = "string"
enum = ["simple", "medium", "complex"]
description = "计划复杂度"




[output_schema.json_schema.properties.risk_level]
type = "string"
enum = ["low", "medium", "high", "critical"]
description = "风险等级"

[output_schema.json_schema.properties.input_schema]
type = "object"
description = "输入参数定义（可选）：键为参数名（snake_case），值为 {type, description, example} 参数定义对象"

[output_schema.example]
text = """
{
  "id": "plan-001",
  "title": "执行任务",
  "description": "根据用户需求执行相应操作",
  "steps": [
    {
      "id": "step-1",
      "order": 1,
      "intent": "获取输入数据",
      "expected_output": "获取所需数据",
      "result_reference": "#E1",
      "dependencies": [],
      "data_requirements": [
        {
          "name": "input",
          "description": "输入数据",
          "required": true,
          "source_hint": "从用户输入中提取"
        }
      ],
      "recommended_tool_categories": ["File"]
    },
    {
      "id": "step-2",
      "order": 2,
      "intent": "处理数据",
      "expected_output": "处理后的数据",
      "result_reference": "#E2",
      "dependencies": ["#E1"],
      "data_requirements": [
        {
          "name": "data",
          "description": "待处理数据",
          "required": true,
          "source_hint": "从 #E1 中获取"
        }
      ],
      "recommended_tool_categories": ["Text"]
    }
  ],
  "complexity": "medium",
  "risk_level": "low",
  "input_schema": {
    "keyword": {
      "type": "string",
      "description": "搜索关键词",
      "example": "安仁乡"
    },
    "limit": {
      "type": "integer",
      "description": "返回结果条数",
      "example": 3
    }
  }
}"""

[output_schema.constraints]
text = "请确保返回有效的JSON格式，不要包含其他文本说明"
