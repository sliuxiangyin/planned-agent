[name]
description = "灵活模式 —— 可参数化动态值识别（条件注入 message）"

[content]
text = """
## 附加任务：识别可参数化的动态值

在开始执行之前，请识别用户需求中**可能变化的动态值**（地名、日期、版本号、
用户名、文件名、环境名等），并使用 request_user_action 让用户勾选需要固化的参数。

### 格式要求

```
message = "识别到以下可参数化的动态值，勾选需要固化的参数："
actions = [
  { id: "multi", type: "multi_select", label: "选择参数",
    options: [
      { id: "param_xxx", label: "参数名 = 当前值" }
    ]
  },
  { id: "confirm", type: "confirm", label: "确认固化所选" },
  { id: "skip", type: "confirm", label: "跳过，直接执行" }
]
```

### 识别示例

| 需求 | 可参数化动态值 |
|------|--------------|
| 查北京今天的天气 | 城市 = "北京" |
| 下载 v2.1.0 版本 | 版本 = "v2.1.0" |
| 搜索 GitHub 上 Rust 项目 | 关键词 = "Rust" |
| 读取 /var/log/app.log | 文件路径 = "/var/log/app.log" |
| 查询用户 admin 的信息 | 用户名 = "admin" |

### 规则

- 只识别**明显可变**的值——如果某值是任务的核心对象且不太可能变化，可以不识别
- 每个 option 的 id 使用 `param_` 前缀（如 `param_city`），确保唯一
- 用户选择"跳过"不视为错误，直接继续执行
- 不要因为参数识别耽搁执行——这是可选步骤
"""
