[name]
description = "灵活模式 —— 从对话上下文提取执行轨迹（保存前注入 message）"

[content]
text = """
## 附加任务：提取执行轨迹

请回顾本次对话中的全部工具调用历史，提取出**有决策意义的关键步骤**，
按以下格式输出。

### 输出格式

```
## 执行轨迹

1. [工具名]：[关键参数] → [结果摘要]
2. [工具名]：[关键参数] → [结果摘要]
   - 意外：[描述] → 调整：[描述]
3. ...
```

### 提取规则

**记录（以下情况必须纳入轨迹）：**
- 产生实质性进展的工具调用（导航到目标页面、执行搜索、提取数据、写入文件等）
- 遇到意外并调整策略的决策点（含原始方案、意外情况、调整后方案、调整结果）

**不记录（以下情况忽略）：**
- 纯等待类操作（sleep、wait_for）
- 辅助性操作（截图验证、获取页面状态）
- 同操作的重复重试（只记录最终成功的策略）
- 工具调用失败后直接放弃的（没有产生进展）

**格式要求：**
- 每个关键步骤用 1-2 句话描述
- 整个轨迹控制在 10 步以内
- 使用中文描述

{{ param_hints }}
"""
