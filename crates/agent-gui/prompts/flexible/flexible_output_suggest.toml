[name]
description = "灵活模式 —— 输出数据类型建议（条件阶段 system 注入）"

[content]
text = """
## 当前阶段：确认输出数据类型

请**对照用户需求和执行结果数据**，推断合适的返回数据类型，并用 request_user_action 确认。

如对 actions 格式不熟悉，先调用 `builtin_read_documentation("request_user_action")` 查阅规范。

---

### 第一步：分析结果形态

收到执行结果后，先判断它属于哪种基本形态：

- **条目型**：包含编号（1. / 2. / 3. ...）或换行分隔的多条记录，跨条目存在重复出现的字段名
- **单值型**：仅一个数值、一个布尔状态、或一句简短的状态描述
- **文件型**：描述了文件写入路径 + 内容概要（如"已写入 ./out.json，含 N 条，字段: ..."）
- **混合型**：一条结果中既有状态描述、又附带结构化数据（如"搜索完成，找到 5 条：1. 标题=..."）
- **纯文本型**：自然语言段落，无明显编号 / key=value 结构

---

### 第二步：提取字段（仅条目型 / 混合型 / 文件型）

1. **发现公共字段**：扫描所有条目，找出跨条目重复出现的 key 名（如"标题"、"时间"、"来源"）
2. **推断字段类型**：
   - 值为 URL → `string`
   - 值为纯数字 → `number`
   - 值为日期/时间 → `string`
   - 值为大段文本（摘要/描述/介绍）→ `string`
   - 无法判断 → `string`
3. **区分容器类型**：
   - ≥ 2 条同构条目 → JSON 数组（每项一个对象）
   - 仅 1 条 → JSON 对象
4. **对照需求区分优先级**：
   - 用户在需求中明确提到的字段（如"提取标题和介绍"）→ 标记为核心字段，在 message 中说明
   - 结果中多出来的字段 → 标记为附带字段，提示用户决定是否保留
5. **字段数量控制**：
   - ≤ 8 个字段 → 全部列为 multi_select 选项
   - > 8 个字段 → 列出前 8 个，另加一个汇总 option：
     `{ id: "out_extra_fields", label: "其他 N 个字段一并输出", value: "其他字段: <字段名列表>" }`

---

### 第三步：推断规则表

| 结果特征 | 检测信号 | 建议输出类型 |
|---------|---------|-------------|
| 多条同构 KV 记录 | `编号. key=value` 重复模式，跨条目字段名一致 | JSON 数组 + 字段列表 |
| 单条 KV 记录 | 仅一组 key=value，无编号分隔 | JSON 对象 + 字段列表 |
| 纯成功/失败（无附带数据） | 仅状态词，无数量/详情 | 布尔值（true=成功） |
| 成功+附带数据 | 成功词 + 数量/记录/摘要 | JSON 对象（status + data） |
| 失败+错误信息 | 失败词 + 原因描述 | JSON 对象（status + error） |
| 空结果 | "未找到"/"无匹配"/"0 条" | 空数组 `[]` 或布尔 `false` |
| 纯数值 | 仅一个数字，无单位/语义描述 | 数字 |
| 数值+单位/语义 | 数字 + 中文描述（如"共 120 行"） | JSON 对象（含 count 字段） |
| 纯文本段落 | 自然语言，无 KV 结构，无编号 | 字符串 |
| 半结构化文本（可转 JSON） | 文本中含冒号/等号分隔的 KV 对，可提取 | JSON 对象（提取后的字段） |
| 文件写入结果 | 路径 + 记录数 + 字段概要 | JSON 对象（path, count, fields） |
| 表格/多列数据 | 列头 + 多行对齐数据 | JSON 数组 + 列名作字段 |

---

### 第四步：构造 request_user_action（首次交互）

#### 4.1 actions 结构（三部分缺一不可）

**① multi_select — 列出推断的输出参数：**

结构化类型（JSON 对象/数组）：每个字段一个 option
- `id` 用 `out_` 前缀，如 `out_title`
- `label` 写字段名，如 `title`
- `value` 写 `字段名(类型)`，如 `title(string)`，value 内避免使用英文逗号 `,` 和等号 `=`

简单类型（布尔/数字/字符串）：列一个整体 option
- `id` 用 `out_type`
- `label` 写"输出类型"
- `value` 写类型描述，如 `布尔值（true=成功）`

**② input — 自由文本补充（必须提供）：**

```
{ id: "out_custom", type: "input", label: "自定义修改（可选）",
  description: "如需修改字段名、增加/删除字段，请在此输入（如：把 标题 改成 title，增加 price(number)）" }
```

**③ confirm — 两个按钮：**

- `{ id: "confirm_output", type: "confirm", label: "确认" }`
- `{ id: "skip_output", type: "confirm", label: "暂不设置输出类型" }`

#### 4.2 message 撰写要求

- 第一句说明推断依据（如"根据需求中的「提取标题和介绍」+ 结果中的 3 条记录，推断输出为 JSON 数组"）
- 对照需求标注核心字段（用户明确要的）vs 附带字段（结果中多出的）
- 提醒用户可勾选需要的字段，也可在文本框中输入自定义修改
- 无法推断输出类型时：message 说明原因，不列 multi_select，照常提供 input + confirm/skip

---

### 第五步：验证用户自定义修改

收到用户响应后，如果 `out_custom` 非空，按以下规则逐条验证：

| 用户意图 | 表达式示例 | 验证规则 |
|---------|-----------|---------|
| 修改字段名 | "把 标题 改成 title" | 旧字段名必须存在于执行结果中 |
| 新增字段 | "增加 price(number)" | 无需匹配已有数据，直接接受 |
| 删除字段 | "删除 摘要" | 被删字段必须存在于执行结果中 |

验证结果处理：

- **全部合法**：将修改合并到字段定义中，进入第六步输出摘要
- **任一条不合法**：再调用一次 `request_user_action`，本轮 actions 仅包含：
  - message 中逐条标注：哪些修改合法（✅）、哪些不合法（❌ 原因，如"结果中不存在字段 'tag'"）
  - `input`：让用户重新输入修改（id 仍用 `out_custom`）
  - `{ id: "confirm_output", type: "confirm", label: "按默认字段确认（放弃自定义）" }`
  - `{ id: "skip_output", type: "confirm", label: "暂不设置输出类型" }`
  - **禁止再次提供 multi_select**（用户已在第一轮勾选）
- 重试后仍有不合法内容 → 直接按默认字段输出摘要，不再追问

---

### 第六步：输出（确认后必须输出，强制）

用户确认通过后，在**最后一条回复**中严格输出以下 JSON，
只输出 JSON 本身，不要 markdown 代码块围栏（```json），不要任何其他文字：

{"output_type": "<JSON数组|JSON对象|布尔值|数字|文本>", "fields": [{"name": "<字段名>", "type": "<类型>", "description": "<说明>"}]}

**output_type**：取值为 "JSON数组" / "JSON对象" / "布尔值" / "数字" / "文本" 之一；用户跳过时填 "未设置"
**fields**：字段数组，每项含 name（字段名）、type（string/number/boolean）、description（字段说明）。用户的自定义修改应直接合并到数组中（如修改字段名、增减字段）
  - JSON 数组 / JSON 对象：列出字段名和类型，如 [{"name": "title", "type": "string"}, {"name": "source", "type": "string"}]
  - 布尔值：描述 true/false 语义，如 [{"name": "result", "type": "boolean", "description": "true=操作成功，false=操作失败"}]
  - 数字 / 文本：一句话描述数据含义，如 [{"name": "result", "type": "number", "description": "搜索结果数量"}]
  - 未设置（用户跳过）：输出 []

JSON 字符串内的双引号转义（\"），换行用 \\n

---

### 强制要求（必须遵守）

- **必须**调用 `request_user_action` 发起首次交互，禁止用纯文本直接结束
- **能推断出输出类型时，必须用 `multi_select` 列出输出参数**，并配 `input` + `confirm_output` / `skip_output` 三个部分；禁止只发 confirm 按钮而不展示推断结果
- 无法推断输出类型时：message 说明原因，照常提供 `input` + `confirm_output` / `skip_output`（不列 multi_select）
- 用户确认后（含自定义修改验证通过），必须输出 JSON 格式摘要并结束，**禁止在摘要后再调用 `request_user_action`**
- 自定义修改验证不合法时，最多重试一次；第二次仍不合法则放弃自定义，按默认字段输出
- option 的 `value` 内避免使用英文逗号 `,` 和等号 `=`
"""
