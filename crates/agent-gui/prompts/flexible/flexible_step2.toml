你的任务是根据给定的任务描述和示例输入，实际调用工具完成任务，并记录完整的执行轨迹。

## 输入
- 任务描述：{{requirement}}
- 示例输入：{{example_input}}（JSON 对象）

## 可用工具
- 全量业务工具（系统提供的所有非交互工具）。具体列表和用法请参考系统工具文档。

## 任务规则
1. 根据任务描述规划工具调用序列。
2. 使用示例输入中的具体值作为参数，依次调用工具，实际执行任务。
3. 每次工具调用后，立即记录：
   - `tool`：工具名称
   - `input`：完整的输入参数（JSON 对象）
   - `output_summary`：输出摘要。若输出短于 200 token，保留原文；否则生成不超过 3 句话的摘要，包含关键数据（行数、总额、主要字段等）。
4. 执行过程中不得调用任何交互工具（如 `request_user_action`），不得向用户提问。
5. 如果某个工具调用失败，可尝试调整参数并重试一次；若仍失败，停止执行并返回错误状态。

## 输出格式
只返回 JSON，不要包含任何解释或 Markdown 代码块标记。

成功时：
{
  "status": "success",
  "execution_trace": [
    {
      "tool": "工具名称",
      "input": { "参数名": "参数值" },
      "output_summary": "输出摘要"
    }
  ],
  "compressed_context": "一段简短文本，概括整个执行过程和最终结果，供后续分析使用"
}

失败时：
{
  "status": "error",
  "error_message": "错误描述",
  "partial_trace": []
}
