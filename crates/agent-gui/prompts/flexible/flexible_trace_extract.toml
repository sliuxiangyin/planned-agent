[name]
description = "灵活模式 —— 从对话上下文提取执行轨迹（保存前注入 message）"

[content]
text = """
## 附加任务：提取执行轨迹

请回顾本次对话中的全部工具调用历史，提取出**有决策意义的关键步骤**，按以下格式输出执行轨迹。

「输入」「输出」两节分别**仅在对应开关开启时提取**：
- 输入参数开关开启 → 提取「输入」节（供提炼 input_schema）
- 输出参数开关开启 → 提取「输出」节（供提炼 output_schema）
- 开关关闭表示对应项无需参数化/无需固化，**不要提取该节，也不要自行推断**（输入固定、输出由执行时决定）

### 输出格式

```
## 执行轨迹
{% if input_params_enabled %}
### 输入
- 任务外部输入参数（用户提供的动态值）：参数名（类型） = 示例值
- 无外部输入时写：无
{% endif %}
### 关键步骤
1. [工具名]：[关键参数] → [结果摘要]
2. [工具名]：[关键参数] → [结果摘要]
   - 意外：[描述] → 调整：[描述]
3. ...
{% if output_params_enabled %}
### 输出
- 最终交付物：输出格式/结构/保存位置（如：JSON 数组，每项含 title(string)、url(string)、summary(string)）
{% endif %}
```

### 提取规则
{% if input_params_enabled %}
**输入（必须提取）：**
- 列出任务依赖的外部输入参数：搜索关键词、URL、文件路径、数值、用户名、地名等
- 每项标注类型（string / integer / number / boolean）和示例值
- 已固化参数（见下方「参数占位符替换」）用 `{% raw %}{{param_name}}{% endraw %}` 占位符代替具体值
- 若对话历史中存在参数识别阶段的勾选卡片（用户勾选固化的参数），也需一并纳入；未经历该阶段则忽略此条
- 参数全部来自前序步骤结果、无用户外部输入时，写"无"
{% endif %}
{% if output_params_enabled %}
**输出（必须提取）：**
- 描述任务的最终交付物：输出格式（JSON 数组/对象、Markdown 报告、文件等）、关键字段、保存位置
- 若结果仅停留在对话回复，则描述回复内容的格式与要点
{% endif %}
**记录（以下情况必须纳入轨迹）：**
- 产生实质性进展的工具调用（导航到目标页面、执行搜索、提取数据、写入文件等）
- 遇到意外并调整策略的决策点（含原始方案、意外情况、调整后方案、调整结果）

**不记录（以下情况忽略）：**
- 纯等待类操作（sleep、wait_for）
- 辅助性操作（截图验证、获取页面状态）
- 同操作的重复重试（只记录最终成功的策略）
- 工具调用失败后直接放弃的（没有产生进展）

**格式要求：**
- 每个关键步骤用 1-2 句话描述
- 整个轨迹控制在 10 步以内
- 使用中文描述
{% if input_params_enabled %}
{{ param_hints }}
{% endif %}
"""

[variables]
param_hints = { description = "参数占位符替换提示（已固化参数列表，无参数时为空字符串）", required = false }
input_params_enabled = { description = "是否启用输入参数识别（false 时不提取「输入」节）", required = false }
output_params_enabled = { description = "是否启用输出类型建议（false 时不提取「输出」节）", required = false }
