[package]
name = "planned-agent-gui"
version = "0.1.0"
edition = "2021"
description = "Planned Agent Desktop GUI — Dioxus 桌面客户端"

[dependencies]
dioxus = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures = "0.3"
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
chrono = { workspace = true }
config = "0.13"
anyhow = "1"
thiserror = { workspace = true }
uuid = { version = "1", features = ["v4"] }
pulldown-cmark = { version = "0.10", default-features = false, features = ["html"] }
ammonia = "4"
planned-agent-core = { path = "../core" }
planned-agent-ai-manager = { path = "../ai-manager" }
planned-agent-mcp-rmcp = { path = "../mcp-rmcp" }
planned-agent-prompt-manager = { path = "../prompt-manager" }
planned-agent-tool-manager = { path = "../tool-manager" }
planned-agent-rag = { path = "../rag" }
planned-agent = { path = "../planned-agent" }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false }
dioxus-icons = { version = "0.1.0", default-features = false }

# SeaORM 2.0 —— 本地 SQLite 持久化
sea-orm = { version = "2.0", features = [
    "sqlx-sqlite",      # SQLite 后端
    "macros",           # DeriveEntityModel / DeriveRelation
    "runtime-tokio",    # 与现有 tokio runtime 对齐
    "with-json",        # JSON 字段（阶段 2 可能用到）
] }

# Migration 框架（关闭默认 cli 特性，避免拉入 clap/dotenvy/sea-orm-cli）
sea-orm-migration = { version = "2.0", default-features = false, features = [
    "sqlx-sqlite",
    "runtime-tokio",
    "with-json",
] }

# 嵌入式 KV 缓存（sled 0.34，纯同步 API；open 走 spawn_blocking）
sled = "0.34"
