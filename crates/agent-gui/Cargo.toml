[package]
name = "planned-agent-gui"
version = "0.1.0"
edition = "2021"
description = "Planned Agent Desktop GUI — Dioxus 桌面客户端"

[dependencies]
dioxus = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
