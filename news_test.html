<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新闻列表</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .news-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .news-item {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .news-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        .news-title {
            font-size: 1.25em;
            color: #1a1a2e;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .news-content {
            color: #4a4a6a;
            line-height: 1.6;
            margin-bottom: 12px;
        }
        .news-meta {
            display: flex;
            justify-content: space-between;
            color: #888;
            font-size: 0.875em;
        }
        .news-tag {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📰 今日新闻</h1>
        <div class="news-list" id="newsList"></div>
    </div>

    <script>
        const newsData = [
            { title: "人工智能技术持续突破，应用场景不断拓展", content: "最新研究表明，AI在医疗诊断、自动驾驶等领域的准确率已超过人类专家水平。", category: "科技", time: "10分钟前" },
            { title: "全球经济复苏信号明显，贸易往来活跃", content: "国际货币基金组织报告显示，多国经济增速超出预期，市场信心持续恢复。", category: "财经", time: "30分钟前" },
            { title: "新能源汽车销量创新高，充电设施建设加速", content: "上半年新能源汽车销量同比增长65%，充电桩覆盖率显著提升。", category: "汽车", time: "1小时前" },
            { title: "文化创意产业发展论坛在北京成功举办", content: "与会专家就数字文创、IP运营等话题深入交流，达成多项合作意向。", category: "文化", time: "2小时前" },
            { title: "城市轨道交通建设取得重大进展", content: "多条地铁线路即将开通，将有效缓解城市交通压力，提升市民出行体验。", category: "民生", time: "3小时前" },
            { title: "体育赛事精彩纷呈，运动员创多项纪录", content: "世界田径锦标赛传来捷报，多位选手打破赛会纪录，展现体育竞技魅力。", category: "体育", time: "4小时前" },
            { title: "科技创新大赛圆满落幕，青年人才脱颖而出", content: "来自全国各地的科技创新项目同台竞技，涌现出一批具有产业化潜力的优秀项目。", category: "教育", time: "5小时前" },
            { title: "绿色能源发展论坛聚焦碳中和目标", content: "专家呼吁加快可再生能源布局，推动能源结构转型，助力实现双碳目标。", category: "环保", time: "6小时前" },
            { title: "数字经济蓬勃发展，催生新业态新模式", content: "直播电商、在线教育等数字经济新业态持续壮大，成为经济增长重要引擎。", category: "商业", time: "7小时前" },
            { title: "国际文化交流活动促进民心相通", content: "多场文化交流活动在各地举办，增进不同文化间的理解与友谊。", category: "国际", time: "8小时前" }
        ];

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        const displayNews = shuffleArray(newsData).slice(0, 6);
        const newsList = document.getElementById('newsList');

        displayNews.forEach(news => {
            const item = document.createElement('div');
            item.className = 'news-item';
            item.innerHTML = `
                <div class="news-title">${news.title}</div>
                <div class="news-content">${news.content}</div>
                <div class="news-meta">
                    <span class="news-tag">${news.category}</span>
                    <span>${news.time}</span>
                </div>
            `;
            newsList.appendChild(item);
        });
    </script>
</body>
</html>
