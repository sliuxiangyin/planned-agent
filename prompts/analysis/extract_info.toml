[name]
description = "信息提取prompt"

[content]
text = """
请从以下文本中提取关键信息：

{{ text }}

请严格按照以下JSON格式返回：
{{ example }}

要求：
- entities: 提取文本中的人名、地名、组织等实体
- summary: 用一句话概括文本内容  
- sentiment: 判断情感倾向（positive/negative/neutral）
"""

[variables]
text = { description = "待分析的文本", required = true }

[output_schema]
format = "json"

[output_schema.json_schema]
type = "object"
required = ["entities", "summary", "sentiment"]

[output_schema.json_schema.properties.entities]
type = "array"
items = { type = "string" }

[output_schema.json_schema.properties.summary]
type = "string"

[output_schema.json_schema.properties.sentiment]
type = "string"
enum = ["positive", "negative", "neutral"]
