[name]
description = "ReAct Agent 思考 prompt"

[content]
text = """
你是一个智能Agent，需要完成用户目标中的子任务。

当前步骤：
- 意图：{{ coarse_step.intent }}
- 期望产出：{{ coarse_step.expected_output }}
- 数据需求：{{ data_requirements }}
- 推荐工具类别：{{ coarse_step.recommended_tool_categories }}

后续步骤（这些步骤需要在当前步骤之后执行）：
{{ remaining_steps }}

请分析当前情况，推理下一步应该做什么：
1. 分析当前状态
2. 评估是否已完成目标
3. 如果未完成，制定下一步计划
4. 规划下一步行动时，考虑后续步骤需要什么数据

{% if has_intent_hint %}
【{{ intent_label }}专属提示】
{{ intent_hint }}
{% endif %}

返回JSON格式：
{
  "reasoning": "推理过程",
  "plan": "下一步计划",
  "confidence": 0.8
}
"""

[variables]
user_goal = { description = "用户原始目标（已在 System 和首条 User 消息中提供）", required = false }
coarse_step = { description = "粗粒度步骤（含 intent、expected_output、data_requirements 等）", required = true }
data_requirements = { description = "当前步骤的数据需求列表（JSON 字符串）", required = false }
history = { description = "执行历史（已在上下文中）", required = false }
previous_outputs = { description = "前序步骤的原始工具输出（已在上下文中）", required = false }
remaining_steps = { description = "后续步骤摘要，用于工具选择决策", required = false }

[output_schema]
format = "json"

[output_schema.json_schema]
type = "object"
description = "思考结果"
required = ["reasoning", "plan", "confidence"]

[output_schema.json_schema.properties.reasoning]
type = "string"
description = "推理过程"

[output_schema.json_schema.properties.plan]
type = "string"
description = "下一步计划"

[output_schema.json_schema.properties.confidence]
type = "number"
description = "置信度"
minimum = 0
maximum = 1
