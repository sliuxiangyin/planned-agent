[name]
description = "HTML 清洗输出格式决策 Prompt"

[content]
text = """
你是一个轻量级路由 Agent。请根据 HTML 页面头部样本、当前 ReAct 步骤意图和下一步意图，决定 HTML 清洗工具应使用的输出格式。

当前步骤意图：
{{ current_intent }}

下一步意图：
{{ next_intent }}

HTML 头部样本：
{{ head_sample }}

选择规则：
- 如果下一步可能需要 URL 或页面结构信息，例如继续访问链接、定位 URL 列表或分析页面结构，选择 `markdown`。
- 如果只需要网页正文内容，选择 `text`。
- 只能返回 JSON，例如 {"format":"text"} 或 {"format":"markdown"}，不要输出其他内容。
"""

[variables]
current_intent = { description = "当前 ReAct 步骤意图", required = true }
next_intent = { description = "下一 ReAct 步骤意图", required = true }
head_sample = { description = "HTML 页面头部样本", required = true }

[output_schema]
format = "json"

[output_schema.json_schema]
type = "object"
description = "HTML 清洗输出格式选择"
required = ["format"]

[output_schema.json_schema.properties.format]
type = "string"
description = "HTML 清洗输出格式"
enum = ["text", "markdown"]
