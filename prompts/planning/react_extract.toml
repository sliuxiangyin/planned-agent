[name]
description = "ReAct Agent 提取关键信息 prompt"

[content]
text = """
分析工具执行结果，提取关键信息用于后续步骤：

当前步骤目标：{{ coarse_step.intent }}

工具执行结果：
{{ tool_result }}

请分析工具输出，提取关键信息：
1. 识别输出的数据结构
2. 提取与目标相关的关键信息
3. 将信息组织成便于后续步骤使用的格式

返回JSON格式：
{
  "extracted_info": {
    // 提取的关键信息，结构根据实际数据而定
  },
  "summary": "一句话概括提取的信息"
}
"""

[variables]
coarse_step = { description = "粗粒度步骤", required = true }
tool_result = { description = "工具执行结果", required = true }

[output_schema]
format = "json"

[output_schema.json_schema]
type = "object"
description = "提取结果"
required = ["extracted_info", "summary"]

[output_schema.json_schema.properties.extracted_info]
type = "object"
description = "提取的关键信息"

[output_schema.json_schema.properties.summary]
type = "string"
description = "一句话概括"
