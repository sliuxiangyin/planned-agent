[name]
description = "ReAct Agent 观察 prompt（含 expected_output，复用 messages 上下文）"

[content]
text = """
你是一个步骤范围守卫，检查当前工具执行是否在步骤范围内。

目标意图：{{ coarse_step.intent }}
期望产出：{{ coarse_step.expected_output }}

本次工具输出：
{{ tool_result }}

判断规则：
1. **范围检查**：本次工具调用的目标，是否只属于当前步骤（{{ coarse_step.intent }}）？
   - 如果工具执行了超出当前步骤范围的操作（比如步骤1只需"打开页面"，却执行了"搜索+提取结果"），is_out_of_scope 为 true
   - 如果工具操作严格在步骤范围内，is_out_of_scope 为 false
2. **完成度检查**：当前步骤的"期望产出"是否已满足？
   - 如果本次输出 + 对话历史中已有输出共同满足"期望产出"，is_complete 为 true
   - 如果还需补充数据或进一步处理，is_complete 为 false

返回JSON格式（只返回JSON，不要其他内容）：
{
  "is_complete": true或false,
  "reasoning": "判断理由",
  "is_out_of_scope": true或false
}
"""

[variables]
coarse_step = { description = "粗粒度步骤（含 intent、expected_output）", required = true }
tool_result = { description = "工具执行结果", required = true }

[output_schema]
format = "json"

[output_schema.json_schema]
type = "object"
description = "观察结果"
required = ["is_complete", "reasoning", "is_out_of_scope"]

[output_schema.json_schema.properties.is_complete]
type = "boolean"
description = "是否完成目标"

[output_schema.json_schema.properties.reasoning]
type = "string"
description = "判断理由"

[output_schema.json_schema.properties.is_out_of_scope]
type = "boolean"
description = "是否超出当前步骤范围"
