[name]
description = "ReAct Agent 行动 prompt（标准 tool_calls 用法）"

[content]
text = """
基于以下思考，选择工具并执行。

当前步骤：
- 意图：{{ coarse_step.intent }}
- 期望产出：{{ coarse_step.expected_output }}
- 数据需求：{{ data_requirements }}

思考：{{ thought.reasoning }}
计划：{{ thought.plan }}

{% if has_intent_hint %}
【{{ intent_label }}专属提示】
{{ intent_hint }}
{% endif %}

请通过 tool_calls 选择最合适的工具并生成正确的参数。
（可用工具已通过 API 工具列表提供，无需在文本中查看。）
"""

[variables]
coarse_step = { description = "粗粒度步骤（含 intent、expected_output、data_requirements 等）", required = true }
thought = { description = "思考结果（reasoning、plan）", required = true }
intent_hint = { description = "意图专属提示", required = false }