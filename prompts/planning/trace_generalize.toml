[name]
description = "轨迹泛化 Prompt：将具体执行流程转化为可复用模板"

[content]
text = """
将以下操作流程中的具体实例值（人名、地名、关键词、URL、数字、文件名）替换为 {% raw %}{{变量名}}{% endraw %} 占位符，生成可复用的模板。

规则：
1. 只替换具体实例值，结构字段（selector、API 路径、工具名）保持不变
2. 工具调用顺序不变
3. 变量名用中文，描述其含义（如 {% raw %}{{关键词}}{% endraw %}、{% raw %}{{文件路径}}{% endraw %}）
4. 根据每个步骤的"输出摘要"，推断数据如何在步骤间流转，填入 reasoning_hint
5. 只输出 JSON，不要其他文字

输入意图：{{ intent }}

工具调用序列（含输出摘要）：
{{ tool_calls }}

输出 JSON 格式：
{% raw %}
{
  "generalized_intent": "泛化后的意图",
  "actions": [
    {
      "tool_name": "工具名",
      "params": {"key": "{{变量}}"},
      "description": "步骤说明",
      "reasoning_hint": "从前一步的输出中提取了什么数据，为什么选择这些参数"
    }
  ]
}
{% endraw %}
"""

[variables]
intent = { description = "当前步骤的原始意图", required = true }
tool_calls = { description = "工具调用序列（含输出摘要，多行文本）", required = true }

[output_schema]
format = "json"
constraints = "请确保返回有效的 JSON 格式，不要包含其他文本说明"

[output_schema.json_schema]
type = "object"
required = ["generalized_intent", "actions"]

[output_schema.json_schema.properties.generalized_intent]
type = "string"
description = "泛化后的意图描述，具体值替换为 {{变量}}"

[output_schema.json_schema.properties.actions]
type = "array"
description = "泛化后的工具调用序列"

[output_schema.json_schema.properties.actions.items]
type = "object"
required = ["tool_name", "params", "description", "reasoning_hint"]

[output_schema.json_schema.properties.actions.items.properties.tool_name]
type = "string"
description = "工具名称"

[output_schema.json_schema.properties.actions.items.properties.params]
type = "object"
description = "泛化后的参数"

[output_schema.json_schema.properties.actions.items.properties.description]
type = "string"
description = "步骤说明"

[output_schema.json_schema.properties.actions.items.properties.reasoning_hint]
type = "string"
description = "数据流转推理"
